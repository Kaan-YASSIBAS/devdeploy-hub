apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-status-smoke-nginx
  namespace: devdeploy-apps
  labels:
    app.kubernetes.io/name: api-status-smoke-nginx
    app.kubernetes.io/managed-by: devdeploy
    app.kubernetes.io/part-of: devdeploy-workloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-status-smoke-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-status-smoke-nginx
        app.kubernetes.io/managed-by: devdeploy
        app.kubernetes.io/part-of: devdeploy-workloads
    spec:
      containers:
        - name: api-status-smoke-nginx
          image: nginx:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
