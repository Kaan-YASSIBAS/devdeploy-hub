apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: devdeploy-apps
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/managed-by: devdeploy
    app.kubernetes.io/part-of: devdeploy-workloads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
