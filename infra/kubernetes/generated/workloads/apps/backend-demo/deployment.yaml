apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-demo
  namespace: devdeploy-workloads
  labels:
    app.kubernetes.io/name: backend-demo
    app.kubernetes.io/managed-by: devdeploy-hub
    devdeploy.io/application: backend-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-demo
      devdeploy.io/application: backend-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-demo
        app.kubernetes.io/managed-by: devdeploy-hub
        devdeploy.io/application: backend-demo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend-demo
          image: ghcr.io/kaan-yassibas/devdeploy-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
