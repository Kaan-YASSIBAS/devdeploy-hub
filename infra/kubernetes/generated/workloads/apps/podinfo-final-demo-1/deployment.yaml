apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-final-demo-1
  namespace: devdeploy-workloads
  labels:
    app.kubernetes.io/name: podinfo-final-demo-1
    app.kubernetes.io/managed-by: devdeploy-hub
    devdeploy.io/application: podinfo-final-demo-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo-final-demo-1
      devdeploy.io/application: podinfo-final-demo-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo-final-demo-1
        app.kubernetes.io/managed-by: devdeploy-hub
        devdeploy.io/application: podinfo-final-demo-1
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo-final-demo-1
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
