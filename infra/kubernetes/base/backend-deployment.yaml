apiVersion: apps/v1
kind: Deployment
metadata:
  name: devdeploy-backend
  namespace: devdeploy
  labels:
    app.kubernetes.io/name: devdeploy-hub
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devdeploy-hub
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devdeploy-hub
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: devdeploy-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devdeploy-secret
                  key: POSTGRES_USER
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: devdeploy-backend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          command:
            - sh
            - -c
            - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://devdeploy:devdeploy@postgres:5432/devdeploy
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devdeploy-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                secretKeyRef:
                  name: devdeploy-secret
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: FRONTEND_ORIGIN
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: ENVIRONMENT
            - name: KUBERNETES_IN_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: KUBERNETES_IN_CLUSTER
            - name: PROMETHEUS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: PROMETHEUS_BASE_URL
            - name: LOKI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: LOKI_BASE_URL
            - name: GRAFANA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GRAFANA_BASE_URL
            - name: GITOPS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITOPS_ENABLED
            - name: GITOPS_AUTO_MERGE
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITOPS_AUTO_MERGE
            - name: GITHUB_OWNER
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITHUB_OWNER
            - name: GITHUB_REPO
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITHUB_REPO
            - name: GITOPS_WORKFLOW_FILE
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITOPS_WORKFLOW_FILE
            - name: GITOPS_DELETE_WORKFLOW_FILE
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITOPS_DELETE_WORKFLOW_FILE
            - name: GITOPS_TARGET_REF
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: GITOPS_TARGET_REF
            - name: GITHUB_WORKFLOW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devdeploy-gitops-secret
                  key: GITHUB_WORKFLOW_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
      volumes:
        - name: backend-tmp
          emptyDir: {}
