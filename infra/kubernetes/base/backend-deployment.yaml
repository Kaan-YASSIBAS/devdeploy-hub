apiVersion: apps/v1
kind: Deployment
metadata:
  name: devdeploy-backend
  namespace: devdeploy
  labels:
    app.kubernetes.io/name: devdeploy-hub
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devdeploy-hub
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devdeploy-hub
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: devdeploy-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://devdeploy:devdeploy@postgres:5432/devdeploy
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devdeploy-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: FRONTEND_ORIGIN
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: devdeploy-config
                  key: ENVIRONMENT
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
