apiVersion: v1
kind: ServiceAccount
metadata:
  name: devdeploy-backend
  namespace: devdeploy
  labels:
    app.kubernetes.io/name: devdeploy-hub
    app.kubernetes.io/component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devdeploy-backend-observability-reader
  labels:
    app.kubernetes.io/name: devdeploy-hub
    app.kubernetes.io/component: backend
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devdeploy-backend-observability-reader
  labels:
    app.kubernetes.io/name: devdeploy-hub
    app.kubernetes.io/component: backend
subjects:
  - kind: ServiceAccount
    name: devdeploy-backend
    namespace: devdeploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devdeploy-backend-observability-reader
