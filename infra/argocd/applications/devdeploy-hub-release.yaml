apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devdeploy-hub-release
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kaan-YASSIBAS/devdeploy-hub.git
    targetRevision: main
    path: infra/kubernetes/overlays/release
  destination:
    server: https://kubernetes.default.svc
    namespace: devdeploy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
