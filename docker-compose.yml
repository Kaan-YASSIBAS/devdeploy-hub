services:
  postgres:
    image: postgres:16-alpine
    container_name: devdeploy-postgres
    environment:
      POSTGRES_DB: devdeploy
      POSTGRES_USER: devdeploy
      POSTGRES_PASSWORD: devdeploy
    ports:
      - "5432:5432"
    volumes:
      - devdeploy_postgres_data:/var/lib/postgresql/data

volumes:
  devdeploy_postgres_data:
