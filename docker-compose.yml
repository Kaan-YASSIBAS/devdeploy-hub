services:
  postgres:
    image: postgres:16-alpine
    container_name: devdeploy-postgres
    environment:
      POSTGRES_DB: devdeploy
      POSTGRES_USER: devdeploy
      POSTGRES_PASSWORD: devdeploy
    ports:
      - "5432:5432"
    volumes:
      - devdeploy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdeploy -d devdeploy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: devdeploy-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://devdeploy:devdeploy@postgres:5432/devdeploy
      JWT_SECRET_KEY: change-me-in-production-use-at-least-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FRONTEND_ORIGIN: http://localhost:5173
      ENVIRONMENT: development
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: devdeploy-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"

volumes:
  devdeploy_postgres_data:
