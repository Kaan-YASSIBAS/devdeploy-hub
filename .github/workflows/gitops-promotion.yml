name: GitOps Promotion

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release image tag to promote, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-release-images:
    name: Promote release image tags
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release image tag
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image_tag must match vMAJOR.MINOR.PATCH, for example v1.1.0"
            exit 1
          fi

      - name: Update release overlay images
        run: python scripts/promote-release-images.py "$IMAGE_TAG"

      - name: Render release overlay
        run: kubectl kustomize infra/kubernetes/overlays/release

      - name: Create promotion pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PROMOTION_TOKEN || github.token }}
          base: main
          branch: gitops/promote-${{ inputs.image_tag }}
          delete-branch: true
          add-paths: |
            infra/kubernetes/overlays/release/kustomization.yaml
          commit-message: "chore: promote release images to ${{ inputs.image_tag }}"
          title: "chore: promote release images to ${{ inputs.image_tag }}"
          body: |
            Promote DevDeploy Hub release images to `${{ inputs.image_tag }}`.

            Backend image:
            `ghcr.io/kaan-yassibas/devdeploy-backend:${{ inputs.image_tag }}`

            Frontend image:
            `ghcr.io/kaan-yassibas/devdeploy-frontend:${{ inputs.image_tag }}`

            Release overlay path:
            `infra/kubernetes/overlays/release`

            After this PR is merged, Argo CD syncs the release overlay.
