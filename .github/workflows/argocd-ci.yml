name: Argo CD CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  argocd-ci:
    name: Argo CD manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Validate Argo CD Application manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path("infra/argocd/applications").glob("*.y*ml"))
          if not files:
              raise SystemExit("No Argo CD Application manifests found.")

          expected_paths = {
              "devdeploy-hub-dev": "infra/kubernetes/overlays/dev",
              "devdeploy-hub-release": "infra/kubernetes/overlays/release",
          }

          for path in files:
              docs = [doc for doc in yaml.safe_load_all(path.read_text()) if doc]
              if not docs:
                  raise SystemExit(f"{path} does not contain any YAML documents.")

              for doc in docs:
                  if doc.get("apiVersion") != "argoproj.io/v1alpha1":
                      raise SystemExit(f"{path}: expected apiVersion=argoproj.io/v1alpha1")
                  if doc.get("kind") != "Application":
                      raise SystemExit(f"{path}: expected kind=Application")

                  metadata = doc.get("metadata") or {}
                  spec = doc.get("spec") or {}
                  source = spec.get("source") or {}
                  destination = spec.get("destination") or {}
                  name = metadata.get("name")

                  if metadata.get("namespace") != "argocd":
                      raise SystemExit(f"{path}: Application must live in the argocd namespace.")
                  if name not in expected_paths:
                      raise SystemExit(f"{path}: unexpected Application name {name!r}.")
                  if source.get("path") != expected_paths[name]:
                      raise SystemExit(f"{path}: source.path must target {expected_paths[name]}.")
                  if destination.get("namespace") != "devdeploy":
                      raise SystemExit(f"{path}: destination.namespace must be devdeploy.")

          print(f"Validated {len(files)} Argo CD manifest file(s).")
          PY
