name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend migration and smoke checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devdeploy
          POSTGRES_USER: devdeploy
          POSTGRES_PASSWORD: devdeploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devdeploy -d devdeploy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://devdeploy:devdeploy@localhost:5432/devdeploy
      JWT_SECRET_KEY: ci-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FRONTEND_ORIGIN: http://localhost:5173
      ENVIRONMENT: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall app

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

      - name: Start API and smoke test health endpoint
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          API_PID=$!

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              kill "$API_PID" || true
              exit 0
            fi
            sleep 2
          done

          kill "$API_PID" || true
          exit 1
