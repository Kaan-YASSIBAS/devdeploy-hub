name: Kubernetes CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  kubernetes-ci:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: kubectl kustomize infra/kubernetes/overlays/dev

      - name: Render release overlay
        run: kubectl kustomize infra/kubernetes/overlays/release

      - name: Write rendered dev manifests
        run: kubectl kustomize infra/kubernetes/overlays/dev > /tmp/devdeploy-dev-k8s.yaml

      - name: Write rendered release manifests
        run: kubectl kustomize infra/kubernetes/overlays/release > /tmp/devdeploy-release-k8s.yaml

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=0.6.7
          curl -L "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes schemas
        run: kubeconform -strict -summary /tmp/devdeploy-dev-k8s.yaml /tmp/devdeploy-release-k8s.yaml
