apiVersion: v1
kind: ServiceAccount
metadata:
  name: devdeploy-backend
  namespace: devdeploy
  labels:
    app.kubernetes.io/name: devdeploy-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devdeploy-hub
    app.kubernetes.io/managed-by: devdeploy-launcher
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devdeploy-backend-root-application-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: devdeploy-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devdeploy-hub
    app.kubernetes.io/managed-by: devdeploy-launcher
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - devdeploy-workloads-root
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devdeploy-backend-root-application-reader
  namespace: argocd
  labels:
    app.kubernetes.io/name: devdeploy-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devdeploy-hub
    app.kubernetes.io/managed-by: devdeploy-launcher
subjects:
  - kind: ServiceAccount
    name: devdeploy-backend
    namespace: devdeploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devdeploy-backend-root-application-reader
