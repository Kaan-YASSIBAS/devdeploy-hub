apiVersion: apps/v1
kind: Deployment
metadata:
  name: devdeploy-backend
  namespace: devdeploy
  labels:
    app.kubernetes.io/name: devdeploy-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devdeploy-hub
    app.kubernetes.io/managed-by: devdeploy-launcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devdeploy-backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devdeploy-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devdeploy-hub
        app.kubernetes.io/managed-by: devdeploy-launcher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: database-migrations
          image: devdeploy-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.db.migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devdeploy-backend-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: backend
          image: devdeploy-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: devdeploy-backend-config
            - secretRef:
                name: devdeploy-backend-secret
          env:
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "60"
          volumeMounts:
            - name: observability-workload-kubeconfig
              mountPath: /var/run/devdeploy/workload-observability
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: observability-workload-kubeconfig
          secret:
            secretName: devdeploy-backend-workload-kubeconfig
            optional: true
