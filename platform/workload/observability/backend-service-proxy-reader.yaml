apiVersion: v1
kind: ServiceAccount
metadata:
  name: devdeploy-observability-reader
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
---
apiVersion: v1
kind: Secret
metadata:
  name: devdeploy-observability-reader-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: devdeploy-observability-reader
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devdeploy-observability-service-proxy-reader
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services/proxy
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devdeploy-observability-service-proxy-reader
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
subjects:
  - kind: ServiceAccount
    name: devdeploy-observability-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devdeploy-observability-service-proxy-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devdeploy-workload-runtime-reader
  namespace: devdeploy-apps
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services/proxy
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devdeploy-workload-runtime-reader
  namespace: devdeploy-apps
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
subjects:
  - kind: ServiceAccount
    name: devdeploy-observability-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devdeploy-workload-runtime-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devdeploy-observability-namespace-reader
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devdeploy-observability-namespace-reader
  labels:
    app.kubernetes.io/managed-by: devdeploy-launcher
    app.kubernetes.io/part-of: devdeploy-observability
subjects:
  - kind: ServiceAccount
    name: devdeploy-observability-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devdeploy-observability-namespace-reader
